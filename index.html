<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kira Smart Assistant – Color Only</title>

<style>
/* ================== GLOBAL ================== */
body{
  margin:0;
  font-family:system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:linear-gradient(180deg,#050b1f,#0b1535);
  color:#e8ecff;
}

.container{
  max-width:420px;
  margin:20px auto;
  padding:16px;
}

/* ================== CARDS ================== */
.card{
  background:#0e1a3a;
  border:1px solid #1f3b8f;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}

h1{
  margin:0 0 6px;
  font-size:20px;
}

.small{
  margin-top:6px;
  font-size:13px;
  opacity:.8;
}

.small b{
  color:#9fb7ff;
}

.center{
  text-align:center;
}

/* ================== COLORS ================== */
.green{color:#2ecc71}
.red{color:#ff4d4d}
.violet{color:#c77dff}
.wait{color:#f1c40f}

/* ================== BUTTONS ================== */
button{
  background:#142b6f;
  border:1px solid #2f55d4;
  color:#fff;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  transition:all .2s ease;
}

button:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 10px rgba(47,85,212,.4);
}

button.danger{
  background:#5a1a1a;
  border-color:#ff4d4d;
}

.flex{
  display:flex;
  gap:10px;
  justify-content:center;
}

/* ================== SYSTEM FOOTER ================== */
.system-footer{
  margin-top:16px;
  opacity:0.95;
}

/* STATUS TEXT */
.footer-status{
  font-size:13px;
  font-weight:500;
  margin-bottom:8px;
  transition:color .3s ease, text-shadow .3s ease;
}

/* ================== FOOTER COLOR STATES ================== */
.footer-green{
  color:#2ecc71;
  text-shadow:
    0 0 6px rgba(46,204,113,.45),
    0 0 12px rgba(46,204,113,.25);
}

.footer-red{
  color:#ff4d4d;
  text-shadow:
    0 0 6px rgba(255,77,77,.45),
    0 0 12px rgba(255,77,77,.25);
}

.footer-violet{
  color:#c77dff;
  text-shadow:
    0 0 6px rgba(199,125,255,.5),
    0 0 14px rgba(199,125,255,.35);
}

.footer-wait{
  color:#f1c40f;
  text-shadow:0 0 6px rgba(241,196,15,.35);
  animation:pulseGlow 2s infinite;
}

/* ================== CONFIDENCE BAR ================== */
.confidence-bar{
  width:100%;
  height:6px;
  background:#1a2555;
  border-radius:6px;
  overflow:hidden;
  margin-bottom:6px;
  position:relative;
}

#confidenceFill{
  height:100%;
  width:0%;
  background:#2ecc71;
  transition:width .4s ease, background .4s ease;
  position:relative;
}

/* subtle scanner shimmer */
#confidenceFill::after{
  content:"";
  position:absolute;
  inset:0;
  opacity:.18;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.45),
    transparent
  );
  animation:scan 2.5s linear infinite;
}

/* ================== WARNING TEXT ================== */
.footer-warning{
  font-size:11px;
  opacity:.55;
}

.footer-regard{
  font-size:11px;
  opacity:.55;
}

/* ================== ANIMATIONS ================== */
@keyframes pulseGlow{
  0%{text-shadow:0 0 4px transparent}
  50%{text-shadow:0 0 14px currentColor}
  100%{text-shadow:0 0 4px transparent}
}

.footer-pulse{
  animation:pulseGlow 1.4s infinite;
}

@keyframes scan{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}

/* ===== PREDICTION CARD HIGHLIGHT ===== */
#predictionBox{
  text-align:center;
  font-size:18px;
  line-height:1.4;
}

#predictionBox .green{
  color:#2ecc71;
  text-shadow:0 0 8px rgba(46,204,113,.6);
  font-weight:700;
}

#predictionBox .red{
  color:#ff4d4d;
  text-shadow:0 0 8px rgba(255,77,77,.6);
  font-weight:700;
}

#predictionBox .wait{
  color:#f1c40f;
  opacity:.85;
  font-weight:600;
}

/* ===== STATUS UI ===== */
.status-live{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:600;
  margin-bottom:6px;
}

.status-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#2ecc71;
  box-shadow:0 0 8px rgba(46,204,113,.8);
}

/* ===== TIMER UI ===== */
.timer-live{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  opacity:.85;
}

.timer-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#f1c40f;
  box-shadow:0 0 6px rgba(241,196,15,.8);
  animation:timerPulse 1.5s infinite;
}

@keyframes timerPulse{
  0%{opacity:.4}
  50%{opacity:1}
  100%{opacity:.4}
}

#predictionBox{
  position:relative;
}

#predictionBox::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:14px;
  pointer-events:none;
  opacity:.35;
}

#predictionBox .wait::after{
  content:" ⏳";
}

#resultBox{
  font-size:15px;
  opacity:.9;
}

#statsBox{
  transition:box-shadow .3s ease;
}

#statsBox.good{
  box-shadow:0 0 14px rgba(46,204,113,.25);
}
#statsBox.classList.toggle("good", acc >= 50);
}

.system-footer{
  margin-top:18px;
  text-align:center;
}

.footer-status{
  letter-spacing:.2px;
}

.card + .card{
  border-top:1px solid rgba(255,255,255,.04);
}

#resultBox{
  text-align:center;
  font-size:18px;
  line-height:1.3;
}

#statsBox{
  text-align:center;
  font-size:18px;
  line-height:1.3;
}

#statsBox span{
  font-weight:600;
}

.accuracy{
  color:#6aa9ff; /* calm blue */
  font-weight:600;
}


</style>
</head>

<body>

<audio id="betSound" src="alert.mp3" preload="auto"></audio>

<div class="container">

<h1>🤖 Kira Predictor 3/4 level |</h1>
<div class="small">🆔 DM for access: <b>@wtf.hrs</b>
  </div>

<div class="card">
  <div class="status-live">
    <span class="status-dot"></span>
    <b>Status:</b> LIVE
  </div>

  <div class="timer-live">
    <span class="timer-dot"></span>
    <span><b id="timer">--</b> seconds remaining</span>
  </div>
</div>

<div class="card" id="predictionBox">Loading…</div>

<div class="card" id="resultBox">🌀 Waiting for result…</div>

<div class="card" id="statsBox">
✅ : 0 | ❌ : 0 | 🎯 : 0%
</div>

<div class="flex">
  <button onclick="resetStats()">🎭 Reset Stats</button>
  <button class="danger" onclick="resetHardStop()">🛑 Reset LOSS</button>
</div>

<div class="card">
📜 <b>Lastest Results</b>
<div id="history"></div>
</div>

<div class="small center system-footer">
  <div id="footerStatus" class="footer-status">
    🧠 Initializing engine…
  </div>
  <div class="footer-warning">
    ⚠️ No guarantees • Avoid over-betting • Stay disciplined ⚠️
  </div>
    <div class="footer-regard">
   ✊ 2026 • All Right • Reserved 💦
  </div>
</div>


</div>

<script>
const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json?pageNo=1&pageSize=10";

const history = document.getElementById("history");

/* ================= STATE ================= */
let state = JSON.parse(localStorage.getItem("dmwin_color_state")) || {
  wins:0,
  losses:0,
  lossStreak:0,
  cooldownRounds: 0,
  hardStop:false,
  lockedIssue:null,
  lockedPrediction:null,
  evaluatedIssue:null,
  biasGreen: 0,
  biasRed: 0,
  lastConfidence:null,
  lastOutcome:null,
  lastCheckedIssue: null,
  confirmingIssue: null,
  resultConfirmSeen: false,
  skipArmed: false,
  violetRisk:false
};

function save(){
  localStorage.setItem("dmwin_color_state",JSON.stringify(state));
}

function clearLastOutcome(){
  if(state.lastOutcome){
    setTimeout(()=>{
      state.lastOutcome = null;
      save();
    }, 5000); // show WIN / LOSS for 5 sec
  }
}

/* ================= BET SOUND SYSTEM ================= */
let lastSoundIssue = null;

function playBetSound(issue){
  if(lastSoundIssue === issue) return; // prevent duplicate sound
  lastSoundIssue = issue;

  const sound = document.getElementById("betSound");
  if(sound){
    sound.currentTime = 0;
    sound.play().catch(()=>{});
  }
}

/* ================= HELPERS ================= */
function colorOf(n){
  const num = Number(n);
  if(Number.isNaN(num)) return "";

  if(num === 0) return "red,violet";
  if(num === 5) return "green,violet";

  return num % 2 === 0 ? "red" : "green";
}

function nextIssue(issue){
  if(!issue || issue.length < 3) return issue;

  const base = issue.slice(0, -2);
  const last = Number(issue.slice(-2));

  if(Number.isNaN(last)) return issue;

  return base + String(last + 1).padStart(2, "0");
}

/* ================= AI CORE — PATH B (CONTROLLED ACTIVE) ================= */
function analyze(list){

  /* SAFETY */
  if(!list || list.length < 6){
    state.lastWaitReason = "📡 Syncing data";
    save();
    return { action:"WAIT", reason:"📡 Syncing data" };
  }

  /* HARD STOP */
  if(state.hardStop){
    state.lastWaitReason = "🛑 Hard stop active";
    save();
    return { action:"WAIT", reason:"🛑 Hard stop active" };
  }

if(state.cooldownRounds > 0){
  state.cooldownRounds--;

  // 🔑 When skip is consumed, disarm skip logic
  if(state.cooldownRounds === 0 && state.skipArmed){
    state.skipArmed = false;

    // IMPORTANT: reduce loss pressure so it doesn’t re-trigger
    state.lossStreak = 1;
  }

  state.lastWaitReason = "🧊 Cooldown active";
  save();
  return { action:"WAIT", reason:"🧊 Cooldown active" };
}

  const last6 = list.slice(0,6);

  let green = 0, red = 0, violet = 0;

  last6.forEach(i=>{
    const c = colorOf(i.number);
    if(c.includes("green")) green++;
    if(c.includes("red")) red++;
    if(c.includes("violet")) violet++;
  });

  /* VIOLET ABSOLUTE BLOCK */
  if(violet >= 2){
    state.violetRisk = true;
    state.lastWaitReason = "💜 Violet zone";
    save();
    return { action:"WAIT", reason:"💜 Violet zone" };
  }
  state.violetRisk = false;

  /* BASIC EDGE */
  const edge = Math.abs(green - red);

  /* LOSS-AWARE FILTER — TRIGGER ONCE */
  if(state.lossStreak === 2 && state.cooldownRounds === 0){
  state.cooldownRounds = 1;
  state.lastWaitReason = "🧊 2 losses → 1 skip";

  // 🔑 IMPORTANT: mark that skip has been scheduled
  state.skipArmed = true;

  save();
  return { action:"WAIT", reason:"🧊 2 losses → 1 skip" };
}

  /* MINIMUM EDGE RULE */
  if(edge < 1){
    state.lastWaitReason = "📉 Weak edge";
    save();
    return { action:"WAIT", reason:"📉 Weak edge" };
  }

  /* PICK */
  let pick;
  if(green > red){
    pick = "GREEN";
  }else if(red > green){
    pick = "RED";
  }else{
    pick = Math.random() > 0.5 ? "GREEN" : "RED";
  }

  /* CONFIDENCE (INFO ONLY) */
  const confidence = Math.min(85, 65 + edge * 5);

  state.lastWaitReason = null;
  state.violetRisk = false;
  save();

  return {
    action: pick,
    confidence
  };
}

/* ================= MAIN LOOP ================= */
async function tick(){

  // 📡 PRO SYNC micro delay
  await new Promise(r => setTimeout(r, 500));

  let list;
  try {
  const res = await fetch(API);
  const json = await res.json();
  list = json.data.list;
} catch(e){
  console.log("API error", e);
  return; // skip this tick safely
}

await new Promise(r => setTimeout(r, 1200));

  const completedIssue = list[0].issueNumber;
  const bettingIssue   = nextIssue(completedIssue);
  const latestColors   = colorOf(list[0].number);

/* === RESULT CHECK (CONTROLLED DEFENSIVE) === */
if (
  state.lockedIssue === completedIssue &&
  state.evaluatedIssue !== completedIssue &&
  state.lockedPrediction
) {

  if (latestColors.includes(state.lockedPrediction)) {

    /* ✅ WIN */
    state.wins++;
    state.lossStreak = 0;
    state.cooldownRounds = 0;
    state.lastOutcome = "WIN";
    clearLastOutcome();

    resultBox.innerHTML =
  "🧾 <b>Last Bet:</b> <span class='green'>WIN</span>";

  } else {

    /* ❌ LOSS */
    state.losses++;
    state.lossStreak++;
    state.lastOutcome = "LOSS";
    clearLastOutcome();

    resultBox.innerHTML =
  "🧾 <b>Last Bet:</b> <span class='red'>LOSS</span>";

    if(state.lossStreak === 2){
      state.cooldownRounds = 1;
    }
    else if(state.lossStreak === 3){
      state.cooldownRounds = 2;
    }
    else if(state.lossStreak >= 4){
      state.hardStop = true;
    }
  }

  /* 🔓 CLEAR TRADE */
  state.lockedPrediction = null;
  state.lockedIssue = null;

  /* ✅ COOLDOWN CONSUMED HERE (ONCE) */
  if(state.cooldownRounds > 0){
    state.cooldownRounds--;
  }

  state.evaluatedIssue = completedIssue;
  save();
}


  /* === PREDICTION LOCK === */
  if(state.lockedIssue !== bettingIssue){
    const d = analyze(list);

    if(d.action === "WAIT"){

  predictionBox.innerHTML =
    "⏸ <b>Prediction:</b> <span class='wait'>WAIT</span><br>" +
"<span class='small'>" + d.reason + "</span>";

  state.lastWaitReason = d.reason;
  save();

}else{
      state.lockedIssue = bettingIssue;
state.lockedPrediction = d.action.toLowerCase();
state.lastWaitReason = null;
state.lastConfidence = d.confidence;
save();

playBetSound(bettingIssue);

      predictionBox.innerHTML =
        "🎯 <b>Prediction:</b> <span class='" + d.action.toLowerCase() + "'>" +
        d.action + "</span><br>" +
        "<span class='small'>Locked for period " + bettingIssue +
        " • Confidence: " + state.lastConfidence + "%</span>";
    }
  }else{
    predictionBox.innerHTML =
      "🔒 <b>Prediction:</b> <span class='" + state.lockedPrediction + "'>" +
      state.lockedPrediction.toUpperCase() + "</span><br>" +
      "<span class='small'>Locked for period " + state.lockedIssue +
" • Confidence: " + (state.lastConfidence || "--") + "%</span>";
  }

  /* === STATS === */
  const total = state.wins + state.losses;
  const acc   = total ? Math.round((state.wins / total) * 100) : 0;
  statsBox.innerHTML = `
  <span class="green">✅ ${state.wins}</span>
  &nbsp; | &nbsp;
  <span class="red">❌ ${state.losses}</span>
  &nbsp; | &nbsp;
  <span class="accuracy">📊 ${acc}%</span>
`;

  /* === LATEST RESULTS (COMPLETED ONLY) === */
  history.innerHTML = list.slice(0,5).map(i=>{
    const parts = colorOf(i.number).split(",");
    const html = parts.map(p=>`<span class="${p}">${p}</span>`).join(" + ");
    return `<div>${i.issueNumber} → ${html}</div>`;
  }).join("");
}

/* ================= TIMER ================= */
setInterval(()=>{
  const s = new Date().getSeconds();
  const remain = s === 0 ? 60 : 60 - s;
  const el = document.getElementById("timer");
  if(el) el.innerText = remain;
},500);

/* ================= CONTROLS ================= */
function resetStats(){
  state.wins = 0;
  state.losses = 0;
  state.lossStreak = 0;
  state.lockedIssue = null;
  state.lockedPrediction = null;
  state.evaluatedIssue = null;
  save();
  location.reload();
}

function resetHardStop(){
  state.lossStreak = 0;
  state.hardStop = false;
  save();
  alert("Hard stop reset");
}

/* ================= START ================= */
function startSyncedLoop(){
  tick(); // run immediately once

  const now = new Date();
  const delay = (60 - now.getSeconds()) * 1000;

  setTimeout(()=>{
    tick(); // run exactly at next minute boundary
    setInterval(tick, 3000); // then perfectly aligned
  }, delay);
}

startSyncedLoop();
/* ===== CLEAR RESULT MESSAGE AFTER DISPLAY ===== */
setInterval(() => {
  if (!state.lastOutcome && resultBox) {
    resultBox.innerHTML = "🌀 Waiting for result...";
  }
}, 5000);
/* ================= FOOTER v2.2 — EVEN CALMER ================= */
let footerTick = 0;
const OWNER_TAG = "🧠 KIRA • Built by HARSH";

/* helper: auto-clear outcome so footer doesn’t get stuck */
function clearOutcomeSoon(){
  if(state.lastOutcome){
    setTimeout(()=>{
      state.lastOutcome = null;
      save();
    }, 5000); // show WIN / LOSS briefly
  }
}

function getFooterMessages(){

  /* 1️⃣ HARD STOP */
  if(state.hardStop){
    return [
      "🛑 HARD STOP ACTIVE",
      "🧊 Trading disabled",
      "🔄 Manual reset required",
      OWNER_TAG
    ];
  }

  /* 2️⃣ VIOLET ZONE */
  if(state.violetRisk){
    return [
      "🟣 Violet zone detected",
      "⚠️ Market unstable",
      "⏸ Trades blocked",
      OWNER_TAG
    ];
  }

  /* 4️⃣ LAST OUTCOME (TEMP) */
  if(state.lastOutcome === "WIN"){
    clearOutcomeSoon();
    return [
      "✅ WIN confirmed",
      "📈 Bias reinforced",
      "🧠 System stabilizing",
      OWNER_TAG
    ];
  }

  if(state.lastOutcome === "LOSS"){
    clearOutcomeSoon();
    return [
      "❌ LOSS confirmed",
      "🧊 Risk tightened",
      "🧠 Protection engaged",
      OWNER_TAG
    ];
  }

  /* 5️⃣ WAIT MODE (REASONED) */
  if(!state.lockedPrediction){
    return [
      "⏸ WAIT MODE",
      state.lastWaitReason || "🧠 Evaluating market",
      "📊 Waiting for strong edge",
      OWNER_TAG
    ];
  }

  /* 6️⃣ LOCKED TRADE */
  return [
    `🔒 Trade locked: ${state.lockedPrediction.toUpperCase()}`,
    `⏳ Period ${state.lockedIssue}`,
    "📡 Monitoring round",
    OWNER_TAG
  ];
}

/* ================= FOOTER RENDER LOOP ================= */
setInterval(()=>{
  const el = document.getElementById("footerStatus");
  if(!el) return;

  const msgs = getFooterMessages();
  const msg  = msgs[footerTick % msgs.length];
  footerTick++;

  /* reset style */
  el.className = "footer-status";

  /* calm color logic */
  if(state.hardStop){
    el.classList.add("footer-red");
  }
  else if(state.violetRisk){
    el.classList.add("footer-violet");
  }
  else if(state.lastOutcome === "WIN"){
    el.classList.add("footer-green");
  }
  else if(state.lastOutcome === "LOSS"){
    el.classList.add("footer-red");
  }
  else if(state.lockedPrediction === "green"){
    el.classList.add("footer-green");
  }
  else if(state.lockedPrediction === "red"){
    el.classList.add("footer-red");
  }
  else{
    el.classList.add("footer-wait");
  }

  el.innerText = msg;

}, 1300); // ⏳ slower = calmer
</script>

</body>
</html>
